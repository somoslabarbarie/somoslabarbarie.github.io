</style></head> <body> <header class="site-header"> <div class="wrap"> <div class="brand-block"> <a class="brand" href="/">Somos la barbarie</a> <span class="tagline">Una tesis, muchos caminos para recorrerla</span> </div> <nav class="main-nav" aria-label="Navegación principal"> <a href="/notas/">Notas</a><a href="/diccionario/">Diccionario</a><a href="/recursos/">Recursos</a><a href="/contacto/" aria-current="page">Contacto</a> <a class="nav-primario" href="/proyecto/">El proyecto →</a> </nav> </div> </header> <main>  <section class="wrap contacto-section" data-astro-cid-2mxdoeuz> <a class="volver-a" href="/" data-astro-cid-aoqxvwzk>← Inicio</a>  <h1 data-astro-cid-2mxdoeuz>Escribinos</h1> <p class="contacto-intro" data-astro-cid-2mxdoeuz>¿Preguntas, correcciones, pedidos, propuestas de colaboración? Este formulario llega directo a la casilla del proyecto.</p> <form id="form-contacto" class="contacto-form" data-astro-cid-2mxdoeuz> <div class="campo" data-astro-cid-2mxdoeuz> <label for="nombre" data-astro-cid-2mxdoeuz>Nombre</label> <input type="text" id="nombre" name="nombre" required data-astro-cid-2mxdoeuz> </div> <div class="campo" data-astro-cid-2mxdoeuz> <label for="email" data-astro-cid-2mxdoeuz>Email</label> <input type="email" id="email" name="email" required data-astro-cid-2mxdoeuz> </div> <div class="campo" data-astro-cid-2mxdoeuz> <label for="mensaje" data-astro-cid-2mxdoeuz>Mensaje</label> <textarea id="mensaje" name="mensaje" rows="6" required data-astro-cid-2mxdoeuz></textarea> </div> <input type="text" name="_gotcha" style="display:none" tabindex="-1" autocomplete="off" data-astro-cid-2mxdoeuz> <button type="submit" class="btn-primario" data-astro-cid-2mxdoeuz>Enviar</button> <p id="contacto-estado" class="contacto-estado" role="status" data-astro-cid-2mxdoeuz></p> </form> </section>  </main> <footer class="site-footer"> <div class="wrap footer-flex"> <img src="/imagenes/mallea-cabeza-penaloza-transparente.png" alt="Ilustración de Cristian Mallea" class="footer-logo"> <div class="footer-contacto"> <a href="/contacto/" class="footer-contacto-link">Contacto →</a> <a href="mailto:facundoesco@gmail.com" class="footer-mail">facundoesco@gmail.com</a> </div> </div> </footer></body></html>  <script type="module">
  const form = document.getElementById('form-contacto');
  const estado = document.getElementById('contacto-estado');
  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = form.querySelector('button');
    btn.disabled = true;
    estado.textContent = 'Enviando…';
    estado.className = 'contacto-estado';
    try {
      const res = await fetch('https://formspree.io/f/xoeaprza', {
        method: 'POST',
        headers: { 'Accept': 'application/json' },
        body: new FormData(form),
      });
      if (res.ok) {
        form.reset();
        estado.textContent = 'Gracias, tu mensaje fue enviado.';
        estado.classList.add('ok');
      } else {
        throw new Error();
      }
    } catch {
      estado.textContent = 'Hubo un error. Probá de nuevo o escribí directo a facundoesco@gmail.com.';
      estado.classList.add('error');
    } finally {
      btn.disabled = false;
    }
  });
</script>
